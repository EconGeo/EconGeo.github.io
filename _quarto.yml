format:
  html:
    theme:
      - cosmo
      - styles.scss
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
    include-after-body:
      - text: |
          <script>
          (function () {
            if (!("IntersectionObserver" in window)) return;
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
            var els = document.querySelectorAll(".theme-card, .paper-card, .pub, .course-card, .feature, .tl-item, .project-link, .stat");
            var io = new IntersectionObserver(function (entries) {
              entries.forEach(function (e) {
                if (e.isIntersecting) { e.target.classList.add("revealed"); io.unobserve(e.target); }
              });
            }, { rootMargin: "0px 0px -40px 0px" });
            els.forEach(function (el) {
              if (el.getBoundingClientRect().top < window.innerHeight) return;
              el.classList.add("reveal-ready"); io.observe(el);
            });
          })();
          </script>
    toc: true
    toc-location: right
    grid:
      body-width: 900px
    link-external-newwindow: true
    link-external-icon: false
